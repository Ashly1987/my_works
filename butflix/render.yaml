services:
  - type: web
    name: butflix-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: DATA_FILE
        value: /tmp/db.json
      - key: EXTERNAL_CATALOG_ENABLED
        value: true
      - key: EXTERNAL_CATALOG_BASE_URL
        value: https://api.tvmaze.com
      - key: EXTERNAL_CATALOG_LIST_PATH
        value: /shows
      - key: EXTERNAL_CATALOG_DETAIL_PATH
        value: /shows/:id
      - key: EXTERNAL_CATALOG_TIMEOUT_MS
        value: 4000
      - key: EXTERNAL_CATALOG_AUTH_HEADER
        sync: false
      - key: EXTERNAL_CATALOG_AUTH_TOKEN
        sync: false

  - type: web
    runtime: static
    name: butflix-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_BASE
        sync: false
      - key: VITE_PROVIDER_MODE
        value: rest
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
