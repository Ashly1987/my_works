<svg width="144" height="144" viewBox="0 0 144 144" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Thiruttu Verse Logo</title>
  <desc id="logoDesc">A modern orbital emblem with the letters T and V.</desc>
  <defs>
    <linearGradient id="bg" x1="18" y1="14" x2="124" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B5E7A" />
      <stop offset="0.56" stop-color="#0F8A9A" />
      <stop offset="1" stop-color="#D24A35" />
    </linearGradient>
    <linearGradient id="ring" x1="24" y1="27" x2="124" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6E4B8" stop-opacity="0.94" />
