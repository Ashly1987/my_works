services:
  - type: web
    name: movies-mcp-server
    # If this service lives in a subfolder of a monorepo, set rootDir, for example:
    # rootDir: apps/movies-mcp-server
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: STARTUP_REFRESH
        value: "true"
      - key: STARTUP_PAGES
        value: "30"
      - key: STARTUP_MAX_DEPTH
        value: "4"

  # Example additional service entry for multi-project repositories:
  # - type: web
  #   name: another-project
  #   rootDir: apps/another-project
  #   env: node
  #   plan: free
  #   buildCommand: npm ci && npm run build
  #   startCommand: npm run start
