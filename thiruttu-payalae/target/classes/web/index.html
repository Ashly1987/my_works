<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Movie Link Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="grain"></div>
    <div class="orb orb-a" aria-hidden="true"></div>
    <div class="orb orb-b" aria-hidden="true"></div>
    <main class="shell">
      <header class="hero">
        <div class="topbar">
          <p class="theme-label">Art Direction</p>
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-pressed="false"
          >
            Switch to Noir Mode
          </button>
        </div>
        <p class="eyebrow">Curated Stream from SQLite</p>
        <h1><span>Movie</span> Link Atlas</h1>

        <form id="search-form" class="search-panel" autocomplete="off">
          <label for="query">Search title</label>
          <div class="search-row">
            <input
              id="query"
              name="query"
              type="search"
              placeholder="Try: Leo, Vikram, Beast"
              minlength="1"
            />
            <button type="submit">Search</button>
          </div>
          <div class="chips" aria-label="Quick searches">
            <button class="chip" type="button" data-query="Leo">Leo</button>
            <button class="chip" type="button" data-query="Vikram">
              Vikram
            </button>
            <button class="chip" type="button" data-query="Beast">Beast</button>
            <button class="chip" type="button" data-query="2024">2024</button>
          </div>
        </form>

        <div class="meta" id="meta">Loading records...</div>
        <div class="refresh-status" id="refresh-status">
          Refresh status: checking...
        </div>
        <div class="kpis" aria-live="polite">
          <article class="kpi">
            <p class="kpi-label">Total Matches</p>
            <p class="kpi-value" id="kpi-total">0</p>
          </article>
          <article class="kpi">
            <p class="kpi-label">Current Page</p>
            <p class="kpi-value" id="kpi-page">0</p>
          </article>
          <article class="kpi">
            <p class="kpi-label">Pages</p>
            <p class="kpi-value" id="kpi-pages">0</p>
          </article>
        </div>
      </header>

      <section class="reveal-block">
        <ul id="results" class="results" aria-live="polite"></ul>
      </section>

      <nav class="pager reveal-block" aria-label="Pagination">
        <button id="prev-btn" type="button">Previous</button>
        <span id="page-label">Page 1</span>
        <button id="next-btn" type="button">Next</button>
      </nav>
    </main>

    <template id="result-item-template">
      <li class="card">
        <div class="poster-wrap">
          <img class="poster" alt="Movie poster" loading="lazy" />
          <span class="rating-chip">NR</span>
        </div>
        <h2 class="title"></h2>
        <p class="sub"></p>
        <a class="play-link" target="_blank" rel="noopener noreferrer">Play</a>
      </li>
    </template>

    <script src="/app.js" defer></script>
  </body>
</html>
