    <link rel="stylesheet" href="styles.css" />

  <body>
    <main class="shell report-shell">
      <header class="report-hero">
        <a class="brand-mark" href="./" aria-label="Back to QuickFlix">
          <span class="brand-logo brand-logo--reel" aria-hidden="true">
            <span class="brand-logo__play"></span>
          </span>
          <span class="eyebrow">QuickFlix</span>
        </a>
        <a class="report-back" href="./">Back to search</a>
      </header>

      <section class="report-page" aria-labelledby="report-title">
        <div class="report-page__head">
          <p class="eyebrow">Views Report</p>
          <h1 id="report-title">Traffic pulse.</h1>
        </div>

        <div class="report-summary">
          <div>
            <span>Today</span>
            <strong id="report-today">0</strong>
          </div>
          <div>
            <span>Total</span>
            <strong id="report-total">0</strong>
          </div>
          <div>
            <span>7 days</span>
            <strong id="report-7">0</strong>
          </div>
          <div>
            <span>14 days</span>
            <strong id="report-14">0</strong>
          </div>
          <div>
            <span>30 days</span>
            <strong id="report-30">0</strong>
          </div>
        </div>

        <div class="report-table" id="report-table" aria-live="polite"></div>
      </section>
    </main>
