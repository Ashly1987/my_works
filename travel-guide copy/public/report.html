<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Monograph | Views Report</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Noto+Serif:ital,wght@0,300;0,400;0,600;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300,0,24&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ["Noto Serif", "serif"],
              sans: ["Manrope", "sans-serif"],
            },
            colors: {
              monograph: {
                bg: "#111111",
                surface: "#171717",
                surfaceSoft: "#1d1d1d",
                border: "#2a2a2a",
                text: "#f3eee7",
                muted: "#b3a99d",
                subtle: "#7c746a",
                tagBg: "#1d2b21",
                tagBorder: "#34513d",
                tagText: "#a4d2a7",
              },
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --font-serif: "Noto Serif";
        --font-sans: "Manrope";
        --font-display: "Noto Serif";
        --color-bg: #0a0a0a;
        --color-surface: #111111;
        --color-surface-soft: #1a1a1a;
        --color-border: #262626;
        --color-text: #f5f0e8;
        --color-muted: #a3a3a3;
        --color-subtle: #737373;
        --color-tag-bg: #1a1a1a;
        --color-tag-border: #333333;
        --color-tag-text: #d4d4d4;
        --color-accent: #c5a059;
        --bg-gradient:
          radial-gradient(
            circle at top,
            rgba(197, 160, 89, 0.08),
            transparent 35%
          ),
          linear-gradient(180deg, #0a0a0a 0%, #050505 100%);
      }

      [data-theme="obsidian"] {
        --font-serif: "Playfair Display";
        --font-sans: "Outfit";
        --font-display: "Cinzel";
        --color-bg: #0f1115;
        --color-surface: #161a22;
        --color-surface-soft: #1f242d;
        --color-border: #2d343f;
        --color-text: #e2e8f0;
        --color-muted: #94a3b8;
        --color-subtle: #64748b;
        --color-tag-bg: #1e293b;
        --color-tag-border: #334155;
        --color-tag-text: #94a3b8;
        --color-accent: #fbbf24;
        --bg-gradient:
          radial-gradient(
            circle at top,
            rgba(251, 191, 36, 0.08),
            transparent 40%
          ),
          linear-gradient(180deg, #0f1115 0%, #080a0d 100%);
      }

      [data-theme="emerald"] {
        --font-serif: "Cormorant Garamond";
        --font-sans: "Manrope";
        --font-display: "Playfair Display";
        --color-bg: #061210;
        --color-surface: #0a1d1a;
        --color-surface-soft: #0f2b26;
        --color-border: #163d37;
        --color-text: #ecfdf5;
        --color-muted: #a7f3d0;
        --color-subtle: #34d399;
        --color-tag-bg: #064e3b;
        --color-tag-border: #065f46;
        --color-tag-text: #6ee7b7;
        --color-accent: #10b981;
        --bg-gradient:
          radial-gradient(
            circle at top,
            rgba(16, 185, 129, 0.1),
            transparent 40%
          ),
          linear-gradient(180deg, #061210 0%, #020605 100%);
      }

      [data-theme="royal"] {
        --font-serif: "Noto Serif";
        --font-sans: "Outfit";
        --font-display: "Cinzel";
        --color-bg: #1a0f0f;
        --color-surface: #261616;
        --color-surface-soft: #331d1d;
        --color-border: #4a2b2b;
        --color-text: #fff5f5;
        --color-muted: #fecaca;
        --color-subtle: #f87171;
        --color-tag-bg: #7f1d1d;
        --color-tag-border: #991b1b;
        --color-tag-text: #fca5a5;
        --color-accent: #dc2626;
        --bg-gradient:
          radial-gradient(
            circle at top,
            rgba(220, 38, 38, 0.12),
            transparent 45%
          ),
          linear-gradient(180deg, #1a0f0f 0%, #100808 100%);
      }

      body {
        background: var(--bg-gradient);
        color: var(--color-text);
        transition:
          background 0.5s ease,
          color 0.5s ease;
      }

      .report-hero {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px;
        border-bottom: 1px solid var(--color-border);
        background-color: var(--color-surface);
      }

      .brand-mark {
        font-family: var(--font-display);
        font-size: 24px;
        font-weight: 600;
        font-style: italic;
        letter-spacing: -0.03em;
        color: var(--color-text);
        text-decoration: none;
      }

      .report-back {
        font-size: 14px;
        color: var(--color-accent);
        text-decoration: none;
        transition: opacity 220ms ease;
      }

      .report-page {
        flex-grow: 1;
        padding: 48px 24px;
        max-width: 900px;
        margin: 0 auto;
      }

      .report-page__head .eyebrow {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--color-muted);
      }

      .report-page__head h1 {
        font-family: var(--font-serif);
        font-size: 42px;
        font-weight: normal;
        line-height: 1.1;
        letter-spacing: -0.04em;
        color: var(--color-text);
        margin-top: 8px;
      }

      .report-summary > div {
        background-color: var(--color-surface-soft);
        border: 1px solid var(--color-border);
        padding: 16px;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .report-summary span {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--color-muted);
      }

      .report-summary strong {
        font-size: 28px;
        font-weight: 600;
        color: var(--color-text);
      }

      .report-table h2 {
        font-family: var(--font-serif);
        font-size: 24px;
        font-weight: normal;
        color: var(--color-text);
        margin-bottom: 20px;
      }

      .report-table th,
      .report-table td {
        border: 1px solid var(--color-border);
        padding: 12px;
        text-align: left;
        color: var(--color-text);
      }

      .report-table th {
        background-color: var(--color-surface-soft);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--color-accent);
      }

      .report-table td {
        font-size: 14px;
        background-color: var(--color-surface);
      }

      .location-item span {
        color: var(--color-muted);
      }

      .location-item strong {
        color: var(--color-text);
      }
    </style>
  </head>

  <body class="min-h-screen font-sans antialiased">
    <main class="report-shell">
      <header class="report-hero">
        <a class="brand-mark" href="./" aria-label="Back to Discover">
          THE MONOGRAPH
        </a>
        <a class="report-back" href="./">Back to Discover</a>
      </header>

      <section class="report-page" aria-labelledby="report-title">
        <div class="report-page__head">
          <p class="eyebrow">Views Report</p>
          <h1 id="report-title">Traffic Pulse</h1>
        </div>

        <div class="report-summary">
          <div>
            <span>Today</span>
            <strong id="report-today">0</strong>
          </div>
          <div>
            <span>Total</span>
            <strong id="report-total">0</strong>
          </div>
          <div>
            <span>7 days</span>
            <strong id="report-7">0</strong>
          </div>
          <div>
            <span>14 days</span>
            <strong id="report-14">0</strong>
          </div>
          <div>
            <span>30 days</span>
            <strong id="report-30">0</strong>
          </div>
        </div>

        <div class="report-table" id="report-table" aria-live="polite"></div>
      </section>
    </main>

    <script>
      // Firebase configuration (from your project, copied from Firebase console)
      window.MONOGRAPH_FIREBASE_CONFIG = {
        apiKey: "AIzaSyBEETopTr4rT97s22WT4kZERN09notevuQ",
        authDomain: "travel-guide-2c40f.firebaseapp.com",
        projectId: "travel-guide-2c40f",
        storageBucket: "travel-guide-2c40f.firebasestorage.app",
        messagingSenderId: "120186895013",
        appId: "1:120186895013:web:7fada33a9bd212d943eb4c",
      };
    </script>
    <script type="module">
      document.addEventListener("DOMContentLoaded", () => {
        const savedTheme = localStorage.getItem("monograph-theme") || "noir";
        document.documentElement.setAttribute("data-theme", savedTheme);
      });
    </script>
    <script type="module" src="report.js"></script>
  </body>
</html>
